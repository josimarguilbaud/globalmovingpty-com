server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El proxy (Traefik) termina TLS y habla HTTP con este contenedor, así que
    # nginx cree que la petición llegó por http y construiría las `Location` de
    # los 301 de abajo con ese esquema. Cada redirección costaría un salto extra
    # para volver a https, y esos 301 existen justamente para conservar SEO.
    # Con esto la Location queda relativa y el navegador conserva el esquema.
    #
    # Al comprobarlo, mirar la cabecera cruda (`curl -D-`): `curl -w
    # '%{redirect_url}'` muestra la URL que resuelve curl, no la que manda
    # nginx, y hace creer que no cambió nada.
    absolute_redirect off;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── 301 del WordPress anterior ────────────────────────────────────────
    #
    # El sitio viejo dejó URLs indexadas que hoy dan 404. Un 404 tira la
    # autoridad acumulada; un 301 la traspasa. Es la misma lección de
    # toursanblas.com, que era el resultado 1 en Bing con el hosting vencido.
    #
    # Solo se redirigen las que eran DEL NEGOCIO. El WordPress era una
    # plantilla de vuelos privados sin limpiar (/jetly-shop/, /carrito/,
    # /few-reasons-people-choose-to-fly-private-jet-charter-copy-5/): esas se
    # dejan morir a propósito. Redirigir basura a la portada no traspasa nada
    # y le dice a Google que la portada responde a consultas que no responde.
    location = /consolidacion-maritima/ { return 301 /servicios/consolidacion-maritima-panama-miami; }
    location = /consolidacion-maritima  { return 301 /servicios/consolidacion-maritima-panama-miami; }
    location = /about-us/               { return 301 /#nosotros; }
    location = /about-us                { return 301 /#nosotros; }
    location = /contact-us/             { return 301 /#contacto; }
    location = /contact-us              { return 301 /#contacto; }
    location = /faqs/                   { return 301 /#servicios; }
    location = /faqs                    { return 301 /#servicios; }
    location = /blog/                   { return 301 /; }

    # Assets con hash: cache larga e inmutable
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    error_page 404 /404.html;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El proxy (Traefik) termina TLS y habla HTTP con este contenedor, así que
    # nginx cree que la petición llegó por http y construiría las `Location` de
    # los 301 de abajo con ese esquema. Cada redirección costaría un salto extra
    # para volver a https, y esos 301 existen justamente para conservar SEO.
    # Con esto la Location queda relativa y el navegador conserva el esquema.
    #
    # Al comprobarlo, mirar la cabecera cruda (`curl -D-`): `curl -w
    # '%{redirect_url}'` muestra la URL que resuelve curl, no la que manda
    # nginx, y hace creer que no cambió nada.
    absolute_redirect off;

    gzip on;
    # Sin `text/html`: nginx siempre lo comprime y listarlo da un aviso de
    # tipo MIME duplicado al arrancar.
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── 301 del WordPress anterior ────────────────────────────────────────
    #
    # El sitio viejo dejó URLs indexadas que hoy dan 404. Un 404 tira la
    # autoridad acumulada; un 301 la traspasa. Es la misma lección de
    # toursanblas.com, que era el resultado 1 en Bing con el hosting vencido.
    #
    # Solo se redirigen las que eran DEL NEGOCIO. El WordPress era una
    # plantilla de vuelos privados sin limpiar (/jetly-shop/, /carrito/,
    # /few-reasons-people-choose-to-fly-private-jet-charter-copy-5/): esas se
    # dejan morir a propósito. Redirigir basura a la portada no traspasa nada
    # y le dice a Google que la portada responde a consultas que no responde.
    location = /consolidacion-maritima/ { return 301 /servicios/consolidacion-maritima-panama-miami; }
    location = /consolidacion-maritima  { return 301 /servicios/consolidacion-maritima-panama-miami; }
    location = /about-us/               { return 301 /#nosotros; }
    location = /about-us                { return 301 /#nosotros; }
    location = /contact-us/             { return 301 /#contacto; }
    location = /contact-us              { return 301 /#contacto; }
    location = /faqs/                   { return 301 /#servicios; }
    location = /faqs                    { return 301 /#servicios; }
    location = /blog/                   { return 301 /; }

    # Assets con hash: cache larga e inmutable
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ── Barra final → sin barra ───────────────────────────────────────────
    #
    # La forma canónica es SIN barra (ver `trailingSlash` en astro.config.mjs).
    # Esta regla manda ahí cualquier visita con barra, en vez de servir la misma
    # página en dos direcciones distintas, que es como se compite contra uno
    # mismo en el índice.
    #
    # Importa por una razón concreta: **`/en/` estaba indexada**. Al pasar a
    # `build.format: 'file'` la portada en inglés dejó de existir en `/en/` y
    # pasó a `/en`. Sin este 301 esa URL, que es la que Google ya tiene, daría
    # 404 y se perdería lo acumulado.
    #
    # Va después de los `location =` de arriba a propósito: en nginx la
    # coincidencia exacta gana a la expresión regular, así que los 301 del
    # WordPress siguen mandando sobre esta regla aunque terminen en barra.
    #
    # `$is_args$args` conserva la cadena de consulta; sin eso, una visita con
    # `?utm_source=...` pierde la atribución al redirigir.
    location ~ ^(/.+)/$ {
        return 301 $1$is_args$args;
    }

    location / {
        # `=404` y NO `/404.html`.
        #
        # Con `/404.html` como último recurso, nginx SIRVE esa página pero con
        # estado 200: un «soft 404». Para Google cada URL mal escrita pasa a ser
        # una página válida que compite en el índice y diluye el sitio, y el
        # error no se nota nunca porque el visitante ve la página correcta.
        #
        # Con `=404` la petición falla de verdad, `error_page` la recoge, y el
        # visitante ve la misma página con el estado que corresponde.
        #
        # `$uri.html` va ANTES de `$uri/`: con `build.format: 'file'` la portada
        # en inglés es `en.html` y además existe el directorio `en/` (donde
        # viven las fichas). Probando el directorio primero, nginx encontraría
        # `en/`, no hallaría índice dentro y respondería 403 en vez de servir
        # `en.html`.
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
